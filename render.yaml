services:
  - type: web
    name: blockroom-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python live.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: MINI_APP_URL
        sync: false
      # polling needs no public webhook URL — simplest on Render free
      - key: BOT_MODE
        value: polling
